<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Shrine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f0e8;color:#222;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#4a4a4a;color:#fff;flex-shrink:0}
header h1{font-size:1.1rem;letter-spacing:.05em}
.nav-month{display:flex;align-items:center;gap:8px}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:1rem}
.nav-btn:hover{background:rgba(255,255,255,.15)}
#monthLabel{font-size:.9rem;min-width:80px;text-align:center}
#msg{padding:6px 16px;font-size:.85rem;color:#555;background:#e8f4e8;display:none;flex-shrink:0}
#msg.err{background:#f4e8e8;color:#a00}
main{flex:1;overflow:hidden;display:flex}
#list-panel{width:100%;display:flex;flex-direction:column;overflow:hidden}
#entry-list{flex:1;overflow-y:auto;padding:4px 0}
.entry-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #e0d9ce}
.entry-item:hover{background:#ede8de}
.entry-title{font-weight:500}
.entry-date{font-size:.8rem;color:#777;margin-top:2px}
#new-btn{margin:12px 16px;padding:10px;background:#5a8a5a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.95rem;flex-shrink:0}
#new-btn:hover{background:#4a7a4a}
#editor-panel{width:100%;display:none;flex-direction:column;overflow:hidden}
#editor-panel.visible{display:flex}
.ed-header{padding:8px 16px;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#back-btn{background:none;border:none;color:#5a5a5a;cursor:pointer;font-size:1.2rem;padding:0 4px;line-height:1}
#title-input{flex:1;border:1px solid #ccc;border-radius:4px;padding:6px 8px;font-size:1rem;min-width:0}
.toolbar{display:flex;gap:4px;padding:6px 16px;background:#eee;border-bottom:1px solid #ddd;flex-shrink:0}
.tb-btn{padding:4px 10px;border:1px solid #ccc;background:#fff;border-radius:3px;cursor:pointer;font-size:.85rem}
.tb-btn:hover{background:#e0e0e0}
#body-area{flex:1;padding:12px 16px;border:none;resize:none;font-family:monospace;font-size:.9rem;background:#fdfaf4;outline:none;overflow-y:auto}
.ed-footer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #ddd;background:#f9f6f0;flex-shrink:0}
#save-btn{flex:1;padding:10px;background:#4a6fa5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.95rem}
#save-btn:hover{background:#3a5f95}
#delete-btn{padding:10px 16px;background:#a54a4a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.95rem}
#delete-btn:hover{background:#952a2a}
#delete-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<header>
  <h1>&#128211; Pocket Shrine</h1>
  <div class="nav-month">
    <button class="nav-btn" id="prev-btn">&#8249;</button>
    <span id="monthLabel">&#8230;</span>
    <button class="nav-btn" id="next-btn">&#8250;</button>
  </div>
</header>
<div id="msg"></div>
<main>
  <div id="list-panel">
    <div id="entry-list"></div>
    <button id="new-btn">&#65291; New Entry</button>
  </div>
  <div id="editor-panel">
    <div class="ed-header">
      <button id="back-btn" title="Back to list">&#8592;</button>
      <input id="title-input" type="text" placeholder="Entry title&#8230;">
    </div>
    <div class="toolbar">
      <button class="tb-btn" title="Bold" onclick="wrap('**','**')"><b>B</b></button>
      <button class="tb-btn" title="Italic" onclick="wrap('*','*')"><i>I</i></button>
      <button class="tb-btn" title="Heading" onclick="insertHeading()">H2</button>
    </div>
    <textarea id="body-area" placeholder="Write your entry&#8230;"></textarea>
    <div class="ed-footer">
      <button id="save-btn">Save</button>
      <button id="delete-btn">Delete</button>
    </div>
  </div>
</main>
<script>
var cur=new Date(),curPath=null,isNew=false;
function pad(n){return String(n).padStart(2,'0');}
function fmtMonth(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showMsg(txt,err){
  var m=document.getElementById('msg');
  m.textContent=txt;m.className=err?'err':'';m.style.display='block';
  setTimeout(function(){m.style.display='none';},2500);
}
function showList(){
  document.getElementById('editor-panel').classList.remove('visible');
  document.getElementById('list-panel').style.display='flex';
  curPath=null;isNew=false;loadList();
}
function showEditor(path,entry){
  document.getElementById('list-panel').style.display='none';
  document.getElementById('editor-panel').classList.add('visible');
  curPath=path;
  document.getElementById('title-input').value=entry.title||'';
  document.getElementById('body-area').value=entry.body||'';
  document.getElementById('delete-btn').disabled=isNew;
}
function parseFrontmatter(text){
  var fm={title:'',date:'',body:text};
  if(text.indexOf('---\n')!==0)return fm;
  var end=text.indexOf('\n---\n',4);
  if(end<0)return fm;
  text.substring(4,end).split('\n').forEach(function(l){
    var c=l.indexOf(': ');
    if(c>0){var k=l.slice(0,c),v=l.slice(c+2);if(k==='title')fm.title=v;else if(k==='date')fm.date=v;}
  });
  fm.body=text.substring(end+5);
  return fm;
}
function loadList(){
  var y=cur.getFullYear(),m=cur.getMonth()+1;
  document.getElementById('monthLabel').textContent=fmtMonth(cur);
  fetch('/api/journal/entries?year='+y+'&month='+m)
    .then(function(r){return r.ok?r.json():[];})
    .then(function(list){
      var el=document.getElementById('entry-list');
      el.innerHTML='';
      if(!list.length){
        el.innerHTML='<p style="padding:16px;color:#888;font-size:.9rem">No entries this month.</p>';
        return;
      }
      list.forEach(function(e){
        var d=document.createElement('div');
        d.className='entry-item';
        d.innerHTML='<div class="entry-title">'+esc(e.title||'Untitled')+'</div>'
                   +'<div class="entry-date">'+esc(e.date||'')+'</div>';
        d.onclick=function(){openEntry(e.path);};
        el.appendChild(d);
      });
    })
    .catch(function(){showMsg('Failed to load entries.',true);});
}
function openEntry(path){
  isNew=false;
  fetch('/api/journal/entry?path='+encodeURIComponent(path))
    .then(function(r){return r.ok?r.text():Promise.reject();})
    .then(function(text){showEditor(path,parseFrontmatter(text));})
    .catch(function(){showMsg('Failed to load entry.',true);});
}
document.getElementById('prev-btn').onclick=function(){cur.setMonth(cur.getMonth()-1);loadList();};
document.getElementById('next-btn').onclick=function(){cur.setMonth(cur.getMonth()+1);loadList();};
document.getElementById('back-btn').onclick=showList;
document.getElementById('new-btn').onclick=function(){
  isNew=true;
  fetch('/api/journal/new',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:'New Entry'})})
    .then(function(r){return r.ok?r.json():Promise.reject();})
    .then(function(j){showEditor(j.path,{title:'New Entry',body:'# New Entry\n\n'});})
    .catch(function(){isNew=false;showMsg('Could not create entry.',true);});
};
document.getElementById('save-btn').onclick=function(){
  if(!curPath)return;
  var title=document.getElementById('title-input').value.trim()||'Untitled';
  var body=document.getElementById('body-area').value;
  var now=new Date();
  var dateStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '
             +pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  var content='---\ntitle: '+title+'\ndate: '+dateStr+'\n---\n'+body;
  fetch('/api/journal/entry',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:curPath,content:content})})
    .then(function(r){
      if(r.ok){showMsg('Saved.');isNew=false;document.getElementById('delete-btn').disabled=false;}
      else showMsg('Save failed.',true);
    })
    .catch(function(){showMsg('Save failed.',true);});
};
document.getElementById('delete-btn').onclick=function(){
  if(!curPath||isNew)return;
  if(!confirm('Delete this entry?'))return;
  fetch('/api/journal/entry?path='+encodeURIComponent(curPath),{method:'DELETE'})
    .then(function(r){
      if(r.ok){showMsg('Entry deleted.');showList();}
      else showMsg('Delete failed.',true);
    })
    .catch(function(){showMsg('Delete failed.',true);});
};
function wrap(before,after){
  var ta=document.getElementById('body-area');
  var s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
  ta.setRangeText(before+sel+after,s,e,'select');ta.focus();
}
function insertHeading(){
  var ta=document.getElementById('body-area');
  var s=ta.selectionStart;
  var lineStart=ta.value.lastIndexOf('\n',s-1)+1;
  ta.setRangeText('## ',lineStart,lineStart,'end');ta.focus();
}
loadList();
</script>
</body>
</html>
