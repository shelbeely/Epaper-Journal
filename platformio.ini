; Xteink X4 E-Paper Journal Firmware
; PlatformIO configuration — Arduino framework on ESP32
;
; Before building:
;   git submodule update --init --recursive
;
; Build environments:
;   pio run -e dev      — development build with diagnostics
;   pio run -e release  — release build (all debug gates closed)

[platformio]
default_envs = dev

; ─── Shared base ────────────────────────────────────────────────────────────
[env:base]
platform   = espressif32
framework  = arduino
; Use the generic ESP32 dev target; swap for a custom board JSON when
; an official Xteink X4 PlatformIO manifest is published.
board      = esp32dev

; Custom partition table: two OTA app slots + FAT data partition
board_build.partitions = partitions_ota.csv

; Regenerate src/web/ui_bundle.h from data/index.html before each build.
extra_scripts = pre:tools/embed_ui.py

; community-sdk libraries via submodule symlinks
lib_deps =
    EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
    BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
    InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
    SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
    greiman/SdFat@^2.3.1
    bblanchon/ArduinoJson@^7.0.0
    mathieucarbou/ESP Async WebServer@^3.0.0
    mathieucarbou/AsyncTCP@^3.0.0

monitor_speed = 115200

; ─── Development environment ────────────────────────────────────────────────
[env:dev]
extends = env:base
build_type = debug
build_flags =
    -DCONFIG_X4_DEV_DIAGNOSTICS=1
    -DCONFIG_X4_AGENT_DIAGNOSTICS=1
    -DCONFIG_X4_VERBOSE_DISPLAY_DIAGNOSTICS=1
    -DCONFIG_X4_DIAG_HTTP_API=1
    ; Single-buffer display mode saves ~52 KB DRAM (required: dual-buffer +
    ; Wi-Fi + AsyncTCP exceeds the classic ESP32's 320 KB DRAM budget)
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE
    ; Firmware version injected at build time by agent_build_dev.sh
    ; Fallback used when building manually
    -DFIRMWARE_VERSION=\"0.0.0-dev\"
    -DFIRMWARE_CHANNEL=\"dev\"
    -DFIRMWARE_DEVICE=\"xteink-x4\"

; ─── Release environment ────────────────────────────────────────────────────
[env:release]
extends = env:base
build_type = release
build_flags =
    -DCONFIG_X4_DEV_DIAGNOSTICS=0
    -DCONFIG_X4_AGENT_DIAGNOSTICS=0
    -DCONFIG_X4_VERBOSE_DISPLAY_DIAGNOSTICS=0
    -DCONFIG_X4_DIAG_HTTP_API=0
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE
    -DFIRMWARE_VERSION=\"0.0.0\"
    -DFIRMWARE_CHANNEL=\"release\"
    -DFIRMWARE_DEVICE=\"xteink-x4\"

; ─── Native unit-test environment ───────────────────────────────────────────
;
; Run with:  pio test -e native
;
; Each test/test_*/  directory is an independent test binary.  We disable
; automatic compilation of src/ (test_build_project_src = false) and instead
; each test file #include-s the specific .cpp files it needs.
;
; The test/mocks/ directory provides Arduino-compatible stubs for all
; hardware-specific headers so that pure-logic modules can be compiled and
; exercised on the host machine without attached hardware.
[env:native]
platform = native
test_framework = unity
; Do not compile src/ automatically — each test file includes what it needs.
test_build_src = false
build_flags =
    ; All diagnostics/logging macros resolve to ((void)0) in non-dev builds.
    -DCONFIG_X4_DEV_DIAGNOSTICS=0
    -DCONFIG_X4_AGENT_DIAGNOSTICS=0
    -DCONFIG_X4_VERBOSE_DISPLAY_DIAGNOSTICS=0
    -DCONFIG_X4_DIAG_HTTP_API=0
    ; Firmware identity constants (required by config.h guard macros).
    -DFIRMWARE_VERSION=\"0.0.0\"
    -DFIRMWARE_CHANNEL=\"dev\"
    -DFIRMWARE_DEVICE=\"xteink-x4\"
    -DFIRMWARE_COMMIT=\"test\"
    ; Tell ArduinoJson that our mock String class is Arduino's String class.
    -DARDUINO=100
    ; Make mock headers shadow the real hardware headers.
    -I test/mocks
    ; Allow tests to include src/ files with short paths (e.g. "journal/...").
    -I src
    ; Use C++17 for inline static data members in mock classes.
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
